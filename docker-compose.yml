services:
  # ----------------------------------------------------
  # 1. MongoDB Database
  # ----------------------------------------------------
  mongodb:
    image: mongo:8
    container_name: guvi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - live_poll_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------
  # 2. Redis In-Memory Cache & Pub/Sub
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: guvi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - live_poll_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------
  # 3. Go Backend REST API & WebSocket Server
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guvi-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - GIN_MODE=release
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=polling_app
      - JWT_SECRET=super_secret_production_jwt_key_guvi_live_polling_2026
      - JWT_EXPIRY_HOURS=24
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - REDIS_ENABLED=true
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - live_poll_network

  # ----------------------------------------------------
  # 4. React Production Frontend (Nginx SPA)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8080/api
        - VITE_WS_BASE_URL=ws://localhost:8080/api/ws
    container_name: guvi-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - live_poll_network

# ----------------------------------------------------
# Named Volumes & Networks
# ----------------------------------------------------
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  live_poll_network:
    driver: bridge